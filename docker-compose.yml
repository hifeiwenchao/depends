x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.30.4-trixie
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./setup/nginx/conf:/etc/nginx:ro
      - ./setup/nginx/certs:/etc/ssl/depends:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - proxy

  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:-dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "3306:3306"
    volumes:
      - ./setup/mysql/data:/var/lib/mysql
      - ./setup/mysql/conf/my.cnf:/etc/my.cnf:ro
      - ./setup/mysql/log:/var/log/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot --silent --skip-column-names --execute='SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      - main

  postgresql:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5432:5432"
    volumes:
      - ./setup/postgresql/data:/var/lib/postgresql
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql --host=127.0.0.1 --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\" --no-password --tuples-only --no-align --set=ON_ERROR_STOP=1 --command='SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      - main

  oracle-permissions:
    image: gvenzl/oracle-free:23.26.3-slim
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        install -d -m 0770 -o oracle -g oinstall /opt/oracle/oradata &&
        chown -R oracle:oinstall /opt/oracle/oradata
    volumes:
      - ./setup/oracle/data:/opt/oracle/oradata
    restart: "no"
    networks:
      - main

  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?ORACLE_PASSWORD is required}
      APP_USER: ${ORACLE_APP_USER:-dev}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?ORACLE_APP_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "1521:1521"
    volumes:
      - ./setup/oracle/data:/opt/oracle/oradata
    mem_limit: 3g
    shm_size: 1g
    restart: unless-stopped
    depends_on:
      oracle-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *default-logging
    networks:
      - main

  redis:
    image: redis:8.10.1
    ports:
      - "6379:6379"
    volumes:
      - ./setup/redis/conf/redis.conf:/etc/redis/redis.conf:ro
      - ./setup/redis/docker-entrypoint.sh:/usr/local/bin/depends-redis-entrypoint:ro
      - ./setup/redis/data:/data
    entrypoint: ["/usr/local/bin/depends-redis-entrypoint"]
    command: ["redis-server", "/etc/redis/redis.conf"]
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    tmpfs:
      - /run/redis:mode=700
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user \"$$REDIS_USERNAME\" --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - main

  rabbitmq:
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./setup/rabbitmq/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./setup/rabbitmq/conf/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./setup/rabbitmq/docker-entrypoint.sh:/usr/local/bin/depends-rabbitmq-entrypoint:ro
      - ./setup/rabbitmq/data:/var/lib/rabbitmq
    entrypoint: ["/usr/local/bin/depends-rabbitmq-entrypoint"]
    command: ["rabbitmq-server"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      - main

  mongo:
    image: mongo:8.3.8-noble
    restart: unless-stopped
    volumes:
      - ./setup/mongo/db:/data/db
      - ./setup/mongo/log:/var/log/mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      - main

  elasticsearch-permissions:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        install -d -m 0770 -o 1000 -g 0 /usr/share/elasticsearch/data &&
        chown -R 1000:0 /usr/share/elasticsearch/data
    volumes:
      - ./setup/elasticsearch/data:/usr/share/elasticsearch/data
    restart: "no"
    networks:
      - main

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    ports:
      - "9200:9200"
    volumes:
      - ./setup/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./setup/elasticsearch/data:/usr/share/elasticsearch/data
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      elasticsearch-permissions:
        condition: service_completed_successfully
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --output /dev/null --user \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - main

networks:
  main:
  proxy:
    name: depends_proxy
