  nginx:
    build:
      context: ./setup/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./setup/nginx/conf:/etc/nginx/conf.d
      - ./setup/nginx/html:/etc/nginx/html
      - ./setup/nginx/ssl:/etc/nginx/ssl
      - ./setup/nginx/static:/etc/nginx/static
      - ./setup/nginx/media:/etc/nginx/media
    restart: always
    environment:
      - TZ=Asia/Shanghai
    expose:
      - "80"
      - "443"
    networks:
      main:
        aliases:
          - nginx

  mysql:
    image: "mysql:8.0.24"
    environment:
      - MYSQL_ROOT_PASSWORD=*qFsHjEd2w#0MHsY
      - MYSQL_USER=dev
      - MYSQL_PASSWORD=tR0zVEv%b#Upn#vo
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    expose:
      - "3306"
    volumes:
      - ./setup/mysql/data:/var/lib/mysql
      - ./setup/mysql/conf/my.cnf:/etc/my.cnf
      - ./setup/mysql/log:/var/log/mysql
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
    networks:
      main:
        aliases:
          - mysql

  redis:
    image: "redis:5.0.0"
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - ./setup/redis/conf/redis.conf:/etc/redis/redis.conf
      - ./setup/redis/data:/data
    command: redis-server /etc/redis/redis.conf
    restart: always
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
    networks:
      main:
        aliases:
          - redis

  mongo:
    image: "mongo:5.0.3"
    restart: always
    volumes:
      - ./setup/mongo/db:/data/db
      - ./setup/mongo/log:/var/log/mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=raLXYJDfF5sCGeZz
    networks:
      main:
        aliases:
          - mongo
    logging:
      driver: "json-file"
      options:
        max-size: "1g"

networks:
  main:
